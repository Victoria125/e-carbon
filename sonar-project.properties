# SonarQube Configuration
sonar.projectKey=e-carbon
sonar.projectName=E-Carbon
sonar.projectVersion=1.0

# Source code directories
sonar.sources=src,server
sonar.tests=cypress,src/test

# Exclusions - arquivos/pastas ignorados pela análise
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/public/**,\
  **/coverage/**,\
  **/server-dist/**,\
  **/*.min.js,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  docs/files/**/*,\
  docs/**/*.md,\
  **/*.md

# Test exclusions
sonar.test.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/cypress/**

# Coverage exclusions
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/cypress/**,\
  **/*.config.ts,\
  **/*.config.js,\
  docs/files/**/*

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific
sonar.typescript.node=node
sonar.javascript.lcov.reportPaths=coverage/lcov.info
